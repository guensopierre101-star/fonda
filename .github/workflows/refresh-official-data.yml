name: Refresh official macro data
on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, official-data-pipeline]
    paths:
      - "scripts/fetch_all_official_rates.py"
      - "tests/test_official_rate_collector.py"
      - ".github/workflows/refresh-official-data.yml"
permissions:
  contents: write
concurrency:
  group: refresh-official-macro-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector validation
        run: python -m unittest discover -s tests -v
      - name: Fetch official observations
        run: python scripts/fetch_all_official_rates.py
      - name: Commit data snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-rates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official macro data snapshot"
            git push
          else
            echo "No data changes to commit"
          fi
