name: Update official rates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official rates
        run: python scripts/collect_rates.py
      - name: Commit changes
        run: |
          git config user.name "fonda-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official-rates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update official rates"
            git push
          fi
