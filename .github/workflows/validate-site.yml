name: Validate site and data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update official rates"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collected data
        run: python scripts/validate_data.py

      - name: Check HTML files and local links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import json
          import sys

          root = Path(".").resolve()
          html_files = sorted(root.rglob("*.html"))
          errors = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.links.append(value)

          for page in html_files:
              parser = Links()
              try:
                  parser.feed(page.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{page}: HTML parse error: {exc}")
                  continue
              for link in parser.links:
                  parsed = urlparse(link)
                  if parsed.scheme or link.startswith(("#", "mailto:", "tel:", "javascript:")):
                      continue
                  target = (page.parent / parsed.path).resolve()
                  if not target.exists():
                      errors.append(f"{page}: missing local target {link}")

          for data_file in sorted((root / "data").glob("*.json")):
              try:
                  json.loads(data_file.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{data_file}: invalid JSON: {exc}")

          if errors:
              print("\\n".join(errors))
              sys.exit(1)
          print(f"PASS: parsed {len(html_files)} HTML files, checked local links, and parsed JSON files.")
          PY
